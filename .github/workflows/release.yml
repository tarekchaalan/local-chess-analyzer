name: Release desktop bundles

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Derive next semantic version tag
        id: vars
        run: |
          set -euo pipefail
          git fetch --tags --quiet || true
          # Allow forcing a version via commit subject: "release: vX.Y.Z" or "version: vX.Y.Z"
          FORCE_TAG="$(git log -1 --pretty=%s | sed -nE 's/.*(release|version):[[:space:]]*(v[0-9]+\.[0-9]+\.[0-9]+).*/\2/ip')"
          if [ -n "${FORCE_TAG:-}" ]; then
            TAG="$(echo "$FORCE_TAG" | head -n1 | tr -d '[:space:]')"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Get latest semver tag (vX.Y.Z); default to v0.0.0
          LATEST="$(git tag --list 'v*' --sort=-version:refname | head -n1 || true)"
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi
          echo "Latest tag: $LATEST"
          COMMITS="$(git log "${LATEST}..HEAD" --pretty=%s%n%b || true)"
          # Determine bump type using Conventional Commits + overrides
          BUMP="patch"
          if echo "$COMMITS" | grep -Eiq '(^|\n)(BREAKING CHANGE:|.*!:)'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -Eiq '(^|\n)feat(\(|:)|(^|\n)\[minor\]|(^|\n)semver:\s*minor'; then
            BUMP="minor"
          elif echo "$COMMITS" | grep -Eiq '(^|\n)\[major\]|(^|\n)semver:\s*major'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -Eiq '(^|\n)\[patch\]|(^|\n)semver:\s*patch'; then
            BUMP="patch"
          elif echo "$COMMITS" | grep -Eiq '(^|\n)fix(\(|:)|(^|\n)perf(\(|:)|(^|\n)refactor(\(|:)'; then
            BUMP="patch"
          fi
          # If no previous tag (v0.0.0), start at v1.0.0
          if [ "$LATEST" = "v0.0.0" ]; then
            NEXT="v1.0.0"
          else
            MAJOR=$(echo "$LATEST" | sed -E 's/^v([0-9]+)\..*/\1/')
            MINOR=$(echo "$LATEST" | sed -E 's/^v[0-9]+\.([0-9]+)\..*/\1/')
            PATCH=$(echo "$LATEST" | sed -E 's/^v[0-9]+\.[0-9]+\.([0-9]+)/\1/')
            case "$BUMP" in
              major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR+1)); PATCH=0 ;;
              patch) PATCH=$((PATCH+1)) ;;
            esac
            NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "tag=${NEXT}" >> "$GITHUB_OUTPUT"
      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.vars.outputs.tag }}"
          git push origin "${{ steps.vars.outputs.tag }}"

  build_macos_silicon:
    needs: prepare_release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Install backend deps and PyInstaller
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pyinstaller
      - name: Keep only Apple Silicon stockfish binary
        run: |
          find stockfish -maxdepth 1 -type f -name 'stockfish_*' ! -name 'stockfish_macos_silicon' -delete
          chmod +x stockfish/stockfish_macos_silicon || true
      - name: Build macOS bundle
        run: |
          pyinstaller --clean --noconfirm pyinstaller.spec
          cd dist
          zip -r LocalChessAnalyzer-macOS-AppleSilicon.zip LocalChessAnalyzer
      - name: Upload macOS (Apple Silicon) artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalChessAnalyzer-macOS-AppleSilicon.zip
          path: dist/LocalChessAnalyzer-macOS-AppleSilicon.zip

  build_macos_intel:
    needs: prepare_release
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Install backend deps and PyInstaller
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pyinstaller
      - name: Keep only Intel (BMI2) stockfish binary
        run: |
          find stockfish -maxdepth 1 -type f -name 'stockfish_*' ! -name 'stockfish_macos_intel' -delete
          chmod +x stockfish/stockfish_macos_intel || true
      - name: Build macOS bundle (Intel)
        run: |
          pyinstaller --clean --noconfirm pyinstaller.spec
          cd dist
          zip -r LocalChessAnalyzer-macOS-Intel.zip LocalChessAnalyzer
      - name: Upload macOS (Intel) artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalChessAnalyzer-macOS-Intel.zip
          path: dist/LocalChessAnalyzer-macOS-Intel.zip

  build_windows:
    needs: prepare_release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build frontend
        shell: pwsh
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Install backend deps and PyInstaller
        shell: pwsh
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pyinstaller
      - name: Keep only Windows stockfish binary
        shell: pwsh
        run: |
          Get-ChildItem -Path stockfish -File | Where-Object { $_.Name -ne 'stockfish_windows.exe' } | Remove-Item -Force
      - name: Build Windows bundle
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm pyinstaller.spec
          cd dist
          Compress-Archive -Path LocalChessAnalyzer -DestinationPath LocalChessAnalyzer-Windows.zip
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalChessAnalyzer-Windows.zip
          path: dist/LocalChessAnalyzer-Windows.zip

  build_linux:
    needs: prepare_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Install backend deps and PyInstaller
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pyinstaller
      - name: Keep only Linux stockfish binary
        run: |
          find stockfish -maxdepth 1 -type f -name 'stockfish_*' ! -name 'stockfish_linux' -delete
          chmod +x stockfish/stockfish_linux || true
      - name: Build Linux bundle
        run: |
          pyinstaller --clean --noconfirm pyinstaller.spec
          cd dist
          zip -r LocalChessAnalyzer-Linux.zip LocalChessAnalyzer
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalChessAnalyzer-Linux.zip
          path: dist/LocalChessAnalyzer-Linux.zip

  publish_release:
    needs: [prepare_release, build_macos_silicon, build_macos_intel, build_windows, build_linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-bundles
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare_release.outputs.tag }}
          name: Local Chess Analyzer ${{ needs.prepare_release.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-bundles/LocalChessAnalyzer-macOS-AppleSilicon.zip/LocalChessAnalyzer-macOS-AppleSilicon.zip
            release-bundles/LocalChessAnalyzer-macOS-Intel.zip/LocalChessAnalyzer-macOS-Intel.zip
            release-bundles/LocalChessAnalyzer-Windows.zip/LocalChessAnalyzer-Windows.zip
            release-bundles/LocalChessAnalyzer-Linux.zip/LocalChessAnalyzer-Linux.zip
          body: |
            Download and run:
            - macOS (Apple Silicon): unzip LocalChessAnalyzer-macOS-AppleSilicon.zip, open the LocalChessAnalyzer executable. If blocked by Gatekeeper, System Settings → Privacy & Security → Open Anyway.
            - macOS (Intel): unzip LocalChessAnalyzer-macOS-Intel.zip, open the LocalChessAnalyzer executable. If blocked by Gatekeeper, System Settings → Privacy & Security → Open Anyway.
            - Windows: unzip LocalChessAnalyzer-Windows.zip, double‑click LocalChessAnalyzer.exe.
            - Linux: unzip LocalChessAnalyzer-Linux.zip, run ./LocalChessAnalyzer (chmod +x if needed).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}