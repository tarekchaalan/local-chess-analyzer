[project]
name = "lca"
version = "2.0.0"
description = "Local Chess Analyzer — private, offline game review for chess.com and Lichess games"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "chess>=1.10",
  "httpx>=0.27",
  "pydantic>=2.7",
  "psutil>=5.9",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1",
]

[project.scripts]
lca = "lca.cli:main"
fetch-stockfish = "lca.tools.fetch_stockfish:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "pyinstaller>=6.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# FastAPI's `Depends()` in defaults is the framework idiom.
extend-per-file-ignores = { "lca/api/*.py" = ["B008"] }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lca"]
