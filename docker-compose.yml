services:
  # Backend (FastAPI + analysis worker)
  backend:
    build:
      context: ./backend
    hostname: backend
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    ports:
      - "42069:42069"

  # Frontend (built SPA served by nginx, proxies /api to the backend)
  frontend:
    build:
      context: ./frontend
    ports:
      - "6969:80"
    depends_on:
      - backend
    restart: unless-stopped
